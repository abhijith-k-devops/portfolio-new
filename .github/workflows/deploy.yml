name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write
  checks: write
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_REPO_NAME: portfolio-new
        run: npm run build

      - name: Check build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Build failed: dist/index.html not found"
            exit 1
          fi
          echo "✅ Build successful"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_REPO_NAME: portfolio-new
        run: npm run build

      - name: Deploy to main (only on main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dist/
          git commit -m "Deploy: built assets for main branch" || true
          git push origin main

      - name: Verify deployment ready (PR check)
        if: github.event_name == 'pull_request'
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ Deployment would fail: dist/index.html not found"
            exit 1
          fi
          echo "✅ Deployment verified: ready to deploy"
